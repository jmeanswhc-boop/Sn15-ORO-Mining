<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>ORO Trajectory Room</title>
    <style>
/* ORO brand tokens. See Frontend/BRAND.md; this file is the offline mirror of
   that palette, so keep the hex values in step with it. The report opens from
   file:// with no network, so the brand fonts are requested from the system and
   fall back to the platform sans when they are not installed locally. */
:root {
  --forest: #0a3815;
  --cloud: #fcfcfa;
  --snowcap: #fcfaf2;
  --sand: #f3f1e7;
  --mist: #cce9ff;
  --gold: #edd03a;
  --amber: #ff9138;
  --sierra: #956825;

  --line: #e2dbc9;
  --line-strong: rgb(10 56 21 / 25%);
  --muted: rgb(10 56 21 / 62%);
  --shadow: 3px 3px 6px 0 rgb(149 104 37 / 8%);

  --radius-card: 20px;
  --radius-inner: 12px;
  --radius-small: 15px;
  --radius-pill: 100px;
  --radius-tag: 115px;

  --aura: linear-gradient(90deg, #fdf9ee, var(--gold), var(--amber), var(--forest));
  --track: linear-gradient(90deg, var(--mist), var(--gold), var(--amber), var(--sierra));

  --font-heading: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Google Sans Flex", "Google Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.15;
  letter-spacing: .01em;
  color: var(--forest);
  background: var(--cloud);
  font-synthesis: none;
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; background: var(--cloud); }
button, input { font: inherit; }
button { color: inherit; }
button, summary, .file-button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sierra); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 800; line-height: .9; letter-spacing: -.02em; }

/* Masthead ---------------------------------------------------------------- */
.masthead {
  position: relative;
  min-height: 104px;
  padding: 22px 28px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  color: var(--snowcap);
  background: var(--forest);
}
/* oro Aura: the brand line, carrying the masthead. */
.masthead::after { content: ""; position: absolute; left: 28px; right: 28px; bottom: 10px; height: 4px; border-radius: var(--radius-pill); background: var(--aura); }
.masthead h1 { margin: 2px 0 0; font-size: clamp(1.8rem, 3vw, 3rem); }
.kicker, .eyebrow { margin: 0; font: 600 .7rem/1.05 var(--font-heading); letter-spacing: .02em; text-transform: uppercase; }
.kicker { color: var(--mist); }
.masthead__actions { display: flex; align-items: center; gap: 14px; }
.load-status { max-width: 300px; color: rgb(252 250 242 / 72%); font-size: .78rem; }
.file-button { padding: 11px 22px; border: 1px solid var(--snowcap); border-radius: var(--radius-pill); background: transparent; color: var(--snowcap); font-family: var(--font-heading); font-weight: 600; letter-spacing: .02em; transition: background 140ms ease, color 140ms ease; }
.file-button:hover { color: var(--forest); background: var(--snowcap); }
#file-input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* Workspace --------------------------------------------------------------- */
.workspace { display: grid; grid-template-columns: minmax(230px, 300px) minmax(460px, 1fr) minmax(260px, 340px); min-height: calc(100vh - 104px); }
.episode-panel, .evidence-panel { min-width: 0; background: var(--sand); }
.episode-panel { padding: 24px 18px; border-right: 1px solid var(--line); }
.evidence-panel { border-left: 1px solid var(--line); }
.trajectory-panel { min-width: 0; background: var(--cloud); }
.panel-heading { display: flex; justify-content: space-between; align-items: end; margin-bottom: 16px; }
.panel-heading h2, .evidence-section h3 { margin: 3px 0 0; }
.count-badge { display: grid; place-items: center; min-width: 34px; height: 34px; padding: 0 10px; color: var(--snowcap); background: var(--forest); border-radius: var(--radius-tag); font: 600 .75rem var(--font-heading); }

.search-field input { width: 100%; padding: 11px 16px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--snowcap); color: var(--forest); }
.search-field input::placeholder { color: var(--muted); }
.status-filters { display: flex; gap: 6px; margin: 10px 0 16px; }
.filter { flex: 1; padding: 7px 6px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: transparent; font: 600 .66rem var(--font-heading); letter-spacing: .02em; text-transform: uppercase; color: var(--forest); }
.filter.is-active { color: var(--snowcap); background: var(--forest); border-color: var(--forest); }
.episode-list { display: grid; gap: 10px; }
.episode-card { width: 100%; padding: 14px 16px; text-align: left; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--snowcap); box-shadow: none; transition: transform 140ms ease, box-shadow 140ms ease; }
.episode-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.episode-card.is-selected { border-color: var(--forest); box-shadow: var(--shadow); }
.episode-card__top, .episode-card__meta { display: flex; justify-content: space-between; gap: 8px; }
.episode-card strong { display: block; margin: 8px 0; overflow-wrap: anywhere; font-family: var(--font-body); font-weight: 600; font-size: .82rem; line-height: .95; }
.family-label, .episode-card__meta { color: var(--muted); font: 600 .63rem/1.15 var(--font-heading); letter-spacing: .02em; text-transform: uppercase; }
.status-chip { padding: 3px 9px; border: 1px solid currentColor; border-radius: var(--radius-tag); font: 600 .58rem var(--font-heading); letter-spacing: .01em; text-transform: uppercase; }
.status-chip--pass { color: var(--forest); }
.status-chip--fail { color: var(--sierra); }
.status-chip--unknown { color: var(--muted); }
.empty-state { color: var(--muted); font-size: .82rem; }

/* Trajectory header ------------------------------------------------------- */
/* Deliberately not sticky: the goal and the collapsed rules vary in height, and
   a tall sticky header covered the first turns of the timeline. */
.trajectory-header { padding: 26px 28px; background: var(--snowcap); border-bottom: 1px solid var(--line); }
.trajectory-header h2 { margin: 6px 0 12px; font-size: clamp(1.35rem, 2vw, 2rem); }
.trajectory-header blockquote { margin: 0; max-width: 78ch; color: var(--forest); font-size: .95rem; font-weight: 300; line-height: 1.2; }
.task-rules { margin-top: 14px; max-width: 78ch; }
.task-rules > summary { color: var(--sierra); }
.task-rules p { margin: 10px 0 0; padding: 14px 16px; max-height: 40vh; overflow: auto; color: var(--muted); background: var(--sand); border: 1px solid var(--line); border-radius: var(--radius-inner); font-size: .82rem; line-height: 1.2; white-space: pre-wrap; }
.trajectory-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.trajectory-meta span { min-width: 0; padding: 5px 12px; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: var(--radius-tag); background: var(--cloud); font: 400 .66rem var(--font-mono); }

/* Timeline ---------------------------------------------------------------- */
.timeline { padding: 30px 28px 72px; }
.turn { position: relative; display: grid; grid-template-columns: 74px minmax(0, 1fr); }
.turn::before { content: ""; position: absolute; left: 31px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.turn-marker { position: relative; z-index: 1; padding-top: 3px; }
.turn-marker span { display: inline-block; padding: 5px 11px; color: var(--snowcap); background: var(--forest); border-radius: var(--radius-tag); font: 600 .58rem var(--font-heading); letter-spacing: .02em; text-transform: uppercase; }
.turn-body { min-width: 0; padding: 0 0 30px 6px; }
.message, .tool-pair, .reasoning, .event-card { margin: 0 0 12px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--snowcap); box-shadow: var(--shadow); }
.message { padding: 16px 18px; }
.message p, .reasoning p { margin: 7px 0 0; white-space: pre-wrap; font-size: .88rem; line-height: 1.2; }
.message--assistant { border-left: 4px solid var(--forest); }
.message--user { border-left: 4px solid var(--sierra); background: var(--mist); }
.tool-pair { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); overflow: hidden; }
.tool-action, .tool-observation { min-width: 0; padding: 16px 18px; }
.tool-action { color: var(--snowcap); background: var(--forest); }
.tool-observation { border-left: 4px solid var(--forest); }
.tool-observation.has-error { border-left-color: var(--amber); }
.tool-pair h4 { margin: 5px 0 9px; font-size: .95rem; font-weight: 600; letter-spacing: 0; }
details summary { font: 600 .72rem var(--font-heading); letter-spacing: .02em; }
pre { max-width: 100%; margin: 10px 0 0; padding: 14px; overflow: auto; color: var(--snowcap); background: var(--forest); border-radius: var(--radius-inner); font: .72rem/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.reasoning { padding: 15px 17px; border-left: 4px solid var(--gold); }
.event-card { border-left: 4px solid var(--gold); box-shadow: none; }
.event-card > summary { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px; list-style-position: inside; }
.event-card small { color: var(--muted); font-family: var(--font-heading); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.event-card pre { margin: 0; border-radius: 0 0 var(--radius-inner) var(--radius-inner); }
.turn-foot { min-height: 1em; color: var(--muted); font: .64rem var(--font-mono); }

/* Outcome and evidence ---------------------------------------------------- */
.outcome-hero { position: relative; padding: 26px 24px 30px; color: var(--snowcap); background: var(--forest); }
/* oro Track: the data line, leading into the verdict figures. */
.outcome-hero::after { content: ""; position: absolute; left: 24px; right: 24px; bottom: 12px; height: 4px; border-radius: var(--radius-pill); background: var(--track); }
.outcome-hero > strong { display: block; margin: 8px 0; font-family: var(--font-heading); font-weight: 800; font-size: 2rem; line-height: .9; letter-spacing: -.02em; }
.outcome-hero p { color: rgb(252 250 242 / 78%); font-size: .84rem; line-height: 1.2; }
.outcome-numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 10px; }
.outcome-numbers span { padding: 11px 13px; border: 1px solid rgb(252 250 242 / 28%); border-radius: var(--radius-inner); font: 400 .64rem var(--font-mono); }
.outcome-numbers b { display: block; margin-top: 5px; color: var(--gold); font-size: .8rem; }
.evidence-section { padding: 20px 22px; border-bottom: 1px solid var(--line); }
.evidence-section h3 { margin-bottom: 13px; font-size: 1rem; font-weight: 600; letter-spacing: 0; }
.evidence-list { display: grid; gap: 8px; }
.evidence-details { margin-top: 14px; }
.evidence-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: .75rem; }
.evidence-row span { color: var(--muted); }
.evidence-row--stack { display: grid; gap: 3px; }
.evidence-row code { overflow: hidden; text-overflow: ellipsis; font: .66rem var(--font-mono); white-space: nowrap; }
.evidence-pass { color: var(--forest); font-weight: 600; }
.evidence-fail { color: var(--sierra); font-weight: 600; }
.evidence-unknown { color: var(--muted); }
.muted { color: var(--muted); font-size: .78rem; }
.raw-section pre { max-height: 70vh; }
.empty-workspace { padding: 80px 30px; text-align: center; }

/* Drop overlay ------------------------------------------------------------ */
.drop-overlay { position: fixed; inset: 16px; z-index: 10; display: none; place-items: center; color: var(--snowcap); background: rgb(10 56 21 / 92%); border: 3px dashed var(--gold); border-radius: var(--radius-card); pointer-events: none; }
.drop-overlay.is-visible { display: grid; }
.drop-overlay div { display: grid; gap: 8px; text-align: center; }
.drop-overlay strong { font-family: var(--font-heading); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; }
.drop-overlay span { color: rgb(252 250 242 / 78%); }

@media (max-width: 1050px) {
  .workspace { grid-template-columns: 230px minmax(0, 1fr); }
  .evidence-panel { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); border-left: 0; }
  .outcome-hero { grid-row: span 2; }
}

@media (max-width: 720px) {
  .masthead { align-items: flex-start; padding: 18px 18px 24px; }
  .masthead::after { left: 18px; right: 18px; }
  .load-status { display: none; }
  .workspace { display: block; }
  .episode-panel { border-right: 0; border-bottom: 1px solid var(--line); }
  .episode-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trajectory-header { padding: 20px 18px; }
  .timeline { padding: 24px 16px 50px; }
  .turn { grid-template-columns: 60px minmax(0, 1fr); }
  .turn::before { left: 24px; }
  .tool-pair { grid-template-columns: 1fr; }
  .tool-observation { border-top: 1px solid var(--line); border-left-width: 4px; }
  .evidence-panel { display: block; }
}

@media (max-width: 440px) {
  .masthead h1 { font-size: 1.65rem; }
  .episode-list { grid-template-columns: 1fr; }
  .turn { grid-template-columns: 1fr; }
  .turn::before { display: none; }
  .turn-marker { margin-bottom: 8px; }
  .turn-body { padding-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>

    <header class="masthead">
      <div>
        <p class="kicker">ORO / EVALUATION INTELLIGENCE</p>
        <h1>Trajectory Room</h1>
      </div>
      <div class="masthead__actions">
        <span id="load-status" class="load-status" role="status">Loading</span>
        <label class="file-button" for="file-input">Open JSON</label>
        <input id="file-input" type="file" accept="application/json,.json" multiple>
      </div>
    </header>

    <main class="workspace" id="drop-zone">
      <aside class="episode-panel" aria-label="Episodes">
        <div class="panel-heading">
          <div><span class="eyebrow">Local run</span><h2>Episodes</h2></div>
          <span id="episode-count" class="count-badge">0</span>
        </div>
        <label class="search-field">
          <span class="sr-only">Search episodes</span>
          <input id="episode-search" type="search" placeholder="Search task or query">

        <div class="status-filters" role="group" aria-label="Filter by result">
          <button class="filter is-active" data-status="all">All</button>
          <button class="filter" data-status="pass">Passed</button>
          <button class="filter" data-status="fail">Failed</button>
        </div>
        <div id="episode-list" class="episode-list"></div>
      </aside>

      <section class="trajectory-panel" aria-label="Selected trajectory">
        <header id="trajectory-header" class="trajectory-header"></header>
        <div id="timeline" class="timeline"></div>
      </section>

      <aside class="evidence-panel" aria-label="Outcome and evidence">
        <div id="outcome"></div>
        <section class="evidence-section raw-section">
          <h3>Source artifact</h3>
          <details><summary>View raw JSON</summary><pre id="raw-json"></pre></details>
        </section>
      </aside>
    </main>

    <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
      <div><strong>Drop trajectory JSON</strong><span>ORO episode v1 or ATIF v1.x</span></div>
    </div>
    <template id="empty-template">
      <div class="empty-workspace"><p class="kicker">NO EPISODE SELECTED</p><h2>Open a trajectory to inspect it.</h2></div>

    <script>

"use strict";
// ---- adapters/atif.js
const RELEASED_ATIF_VERSION = /^ATIF-v1\.[0-7]$/;

function requireAtif(input, sourceName) {
  if (!input || typeof input.schema_version !== "string" || !RELEASED_ATIF_VERSION.test(input.schema_version)) {
    throw new Error(`${sourceName}: expected a released ATIF version from ATIF-v1.0 through ATIF-v1.7`);
  }
  if (!Array.isArray(input.steps)) {
    throw new Error(`${sourceName}: ATIF trajectory is missing a steps array`);
  }
}

function contentForDisplay(content, sourceName, field) {
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) {
    throw new Error(`${sourceName}: ${field} must be a string or ATIF content array`);
  }
  return content
    .map((part, index) => {
      if (part?.type === "text" && typeof part.text === "string") return part.text;
      if (part?.type === "image" && typeof part.source?.path === "string") {
        return `[Image: ${part.source.path}]`;
      }
      throw new Error(`${sourceName}: ${field}[${index}] is not a supported ATIF content part`);
    })
    .join("\n");
}

function observationValue(result, sourceName, stepIndex, resultIndex) {
  const content = result?.content;
  if (typeof content === "string") {
    try {
      return JSON.parse(content);
    } catch {
      return content;
    }
  }
  if (Array.isArray(content)) {
    return contentForDisplay(content, sourceName, `steps[${stepIndex}].observation.results[${resultIndex}].content`);
  }
  return null;
}

function normalizeToolCalls(step, sourceName, stepIndex) {
  const results = step.observation?.results ?? [];
  return (step.tool_calls ?? []).map((call) => {
    const matchingResults = results
      .map((result, resultIndex) => ({ result, resultIndex }))
      .filter(({ result }) => result.source_call_id === call.tool_call_id);
    const values = matchingResults.map(({ result, resultIndex }) =>
      observationValue(result, sourceName, stepIndex, resultIndex),
    );
    const extras = matchingResults.map(({ result }) => result.extra).filter(Boolean);
    return {
      id: call.tool_call_id,
      name: call.function_name,
      arguments: call.arguments,
      observation: matchingResults.length
        ? {
            value: values.length === 1 ? values[0] : values,
            error: extras.find((extra) => extra?.error)?.error ?? null,
            done: extras.some((extra) => extra?.done === true),
            raw: matchingResults.map(({ result }) => result),
          }
        : null,
    };
  });
}

function unmatchedObservationEvents(step, toolCalls, sourceName, stepIndex) {
  const matchedIds = new Set(toolCalls.map((call) => call.id));
  return (step.observation?.results ?? [])
    .map((result, resultIndex) => ({ result, resultIndex }))
    .filter(({ result }) => !result.source_call_id || !matchedIds.has(result.source_call_id))
    .map(({ result, resultIndex }) => ({
      actor: "environment",
      kind: "observation",
      payload: {
        source_call_id: result.source_call_id ?? null,
        content: observationValue(result, sourceName, stepIndex, resultIndex),
        extra: result.extra ?? null,
      },
    }));
}

function normalizeAtifTrajectory(input, sourceName = "trajectory.json") {
  requireAtif(input, sourceName);
  const timeline = input.steps.map((step, index) => {
    if (!["system", "user", "agent"].includes(step.source)) {
      throw new Error(`${sourceName}: steps[${index}].source must be system, user, or agent`);
    }
    const toolCalls = normalizeToolCalls(step, sourceName, index);
    const role = step.source === "agent" ? "assistant" : step.source;
    return {
      turn: step.step_id ?? index + 1,
      messages: step.message == null
        ? []
        : [{ role, content: contentForDisplay(step.message, sourceName, `steps[${index}].message`), metadata: {} }],
      toolCalls,
      events: unmatchedObservationEvents(step, toolCalls, sourceName, index),
      reasoning: step.reasoning_content ?? null,
      metrics: step.metrics ?? {},
      latencyMs: step.metrics?.extra?.latency_ms ?? null,
      error: step.extra?.error ?? null,
      raw: step,
    };
  });

  const firstUserMessage = timeline
    .flatMap((turn) => turn.messages)
    .find((message) => message.role === "user")?.content;
  const oroMetadata = input.extra?.oro ?? {};
  const oroOutcome = input.final_metrics?.extra?.oro ?? {};

  return {
    id: input.trajectory_id ?? sourceName,
    sourceName,
    format: input.schema_version.replace("ATIF-", "ATIF "),
    task: {
      id: oroMetadata.task_id ?? input.trajectory_id ?? sourceName,
      family: oroMetadata.family ?? "ATIF",
    },
    query: firstUserMessage ?? "",
    taskRules: "",
    correct: typeof oroOutcome.success === "boolean" ? oroOutcome.success : null,
    reward: oroOutcome.reward ?? null,
    terminalReason: oroOutcome.termination_reason ?? "completed",
    timeline,
    verdict: { ...oroOutcome, atif_metrics: input.final_metrics ?? {} },
    provenance: {
      trajectory_id: input.trajectory_id ?? null,
      session_id: input.session_id ?? null,
      agent_name: input.agent?.name ?? null,
      agent_version: input.agent?.version ?? null,

    },
    raw: input,

function requireEpisode(input, sourceName) {

    .filter((entry) => entry.turn === turn && ["model_message", "user_message"].includes(entry.kind))

    .filter((message) => message.content.trim().length > 0);

    .filter(
      (entry) =>
        entry.turn === turn &&
        !["model_action", "model_message", "observation", "user_message"].includes(entry.kind),
    )
    .map((entry) => ({
      actor: entry.actor,
      kind: entry.kind,
      payload: entry.payload,
      sequence: entry.seq,
      stateHash: entry.state_hash,
    }));
}

function pairCalls(trace) {
  const observations = new Map(
    (trace.response?.calls ?? []).map((call) => [
      call.call_id,
      call.observation
        ? {
            value: call.observation.observation ?? null,
            error: call.observation.error ?? null,
            done: call.observation.done ?? false,
          }
        : null,
    ]),
  );
  return (trace.request?.calls ?? []).map((call) => ({
    id: call.call_id,
    name: call.action?.name ?? "unknown",
    arguments: call.action?.args ?? {},
    observation: observations.get(call.call_id) ?? null,
  }));
}

// The runtime hands the agent one string: the shopper's goal, then a "Task rules"
// block carrying the family's system prompt. Only the goal belongs in the header.
function splitQuery(query) {
  const marker = query.indexOf("\n\nTask rules:");
  if (marker === -1) return { query, taskRules: "" };
  return {
    query: query.slice(0, marker).trim(),
    taskRules: query.slice(marker + "\n\nTask rules:".length).trim(),
  };
}

function normalizeOroEpisode(input, sourceName = "trajectory.json") {
  const episode = requireEpisode(input, sourceName);
  const ledger = Array.isArray(episode.ledger) ? episode.ledger : [];
  const callTrace = Array.isArray(episode.call_trace) ? episode.call_trace : [];

  return {
    id: episode.evaluation_run_id ? `${episode.evaluation_run_id}:${episode.task_id}` : sourceName,
    sourceName,
    format: "ORO episode v1",
    task: {
      id: episode.task_id ?? "Unknown task",
      family: episode.family ?? "unknown",
    },
    ...splitQuery(episode.bootstrap?.policy_view?.query ?? ""),
    correct: typeof episode.verdict?.correct === "boolean" ? episode.verdict.correct : null,
    reward: episode.verdict?.paid_reward ?? null,
    terminalReason: episode.terminal_reason ?? episode.outcome ?? "unknown",
    timeline: callTrace.map((trace, index) => {
      const turn = trace.request?.turn ?? trace.response?.turn ?? index + 1;
      const events = eventsForTurn(ledger, turn);
      if (trace.state_hash_before && trace.state_hash_after && trace.state_hash_before !== trace.state_hash_after) {
        events.push({
          actor: "environment",
          kind: "state_change",
          payload: { before: trace.state_hash_before, after: trace.state_hash_after },
        });
      }
      return {
        turn,
        messages: messagesForTurn(ledger, turn),
        toolCalls: pairCalls(trace),
        events,
        latencyMs: trace.latency_ms ?? trace.timing_ms?.total ?? null,
        error: trace.error ?? null,
        stateBefore: trace.state_hash_before ?? null,
        stateAfter: trace.state_hash_after ?? null,
        raw: trace,
      };
    }),
    verdict: episode.verdict ?? {},
    failure: episode.failure ?? null,
    provenance: {
      ...(episode.provenance ?? {}),
      execution_contract_id: input.execution_contract_id ?? null,
      agent_version_id: episode.agent_version_id ?? null,
      evaluation_run_id: episode.evaluation_run_id ?? null,
      session_id: episode.session_id ?? episode.bootstrap?.session_id ?? null,
    },
    raw: input,
  };
}

// ---- adapters/world.js
// A world-pack episode (`oro.world_episode.v1`, runtime contract 8): the runtime's ledger records each
// numbered step's action and observation, the shopper messages and replies, and the finish.
// Local runs label it oro.world_episode.v1; network artifacts keep the oro.environment_episode.v1 label but carry
// the same runtime ledger ({ledger_format, episode: [...]}), which is what tells the two formats apart.
function isWorldLedgerEpisode(input) {
  return Array.isArray(input?.episode?.ledger?.episode);
}

function requireWorldEpisode(input, sourceName) {
  const label = input?.schema_version;
  if (!(label === "oro.world_episode.v1" || (label === "oro.environment_episode.v1" && isWorldLedgerEpisode(input)))) {
    throw new Error(`${sourceName}: expected a world-pack episode (oro.world_episode.v1)`);
  }
  return input.episode;
}

// The renderer's outcome contract: failure.primary with failure.categories.
function worldFailure(episode, verdict) {
  if (verdict?.category) {
    const flags = Array.isArray(verdict.flags) ? verdict.flags : [];
    return { primary: verdict.category, categories: flags.length ? flags : [verdict.category] };
  }
  if (!verdict && (episode.error || (episode.outcome && episode.outcome !== "completed"))) {
    return { primary: episode.outcome ?? "no verdict", categories: [String(episode.error ?? "no verdict")] };
  }
  return null;
}

function worldTimeline(records) {
  const turns = [];
  let current = null;
  for (const record of records) {
    if (record.kind === "action") {
      current = {
        turn: record.step,
        messages: [],
        toolCalls: [{ id: String(record.step), name: record.tool ?? "unknown", arguments: record.args ?? {}, observation: null }],
        events: [],
        latencyMs: null,
        error: null,
        stateBefore: null,
        stateAfter: null,
        raw: record,
      };
      turns.push(current);
    } else if (record.kind === "observation" && current && record.step === current.turn) {
      const value = record.observation ?? null;
      current.toolCalls[0].observation = { value, error: value?.error ?? null, done: false };
    } else if ((record.kind === "message" || record.kind === "reply") && current) {
      const content = typeof record.text === "string" ? record.text : "";
      if (content.trim()) current.messages.push({ role: record.kind === "message" ? "assistant" : "user", content, metadata: record });
    } else if (current && !["open", "start", "finish"].includes(record.kind)) {
      current.events.push({ actor: "environment", kind: record.kind, payload: record, sequence: null, stateHash: null });
    }
  }
  return turns;
}

function normalizeWorldEpisode(input, sourceName = "trajectory.json") {
  const episode = requireWorldEpisode(input, sourceName);
  const records = Array.isArray(episode.ledger?.episode) ? episode.ledger.episode : [];
  const verdict = episode.verdict ?? null;
  const finish = records.findLast?.((r) => r.kind === "finish") ?? records.filter((r) => r.kind === "finish").pop();
  return {
    id: episode.evaluation_run_id ? `${episode.evaluation_run_id}:${episode.task_id}` : sourceName,
    sourceName,
    format: "ORO world episode v1",
    task: { id: episode.task_id ?? "Unknown task", family: episode.world_id ?? "world" },
    query: episode.request_text ?? "",
    taskRules: "",
    correct: verdict ? verdict.score === 1 : null,
    reward: verdict?.score ?? null,
    terminalReason: episode.terminal_reason ?? finish?.reason ?? episode.outcome ?? "unknown",
    timeline: worldTimeline(records),
    verdict: verdict ?? {},
    failure: worldFailure(episode, verdict),
    provenance: {
      agent_version_id: episode.agent_version_id ?? null,
      evaluation_run_id: episode.evaluation_run_id ?? null,
      session_id: episode.session_id ?? null,
      pack_sha256: episode.pack_sha256 ?? null,
    },
    raw: input,
  };
}

// ---- adapters/index.js

function normalizeTrajectory(input, sourceName = "trajectory.json") {
  if (!input || typeof input !== "object" || !input.schema_version) {
    throw new Error(`${sourceName}: missing schema_version`);
  }
  if (input.schema_version === "oro.world_episode.v1" || isWorldLedgerEpisode(input)) {
    return normalizeWorldEpisode(input, sourceName);
  }
  if (input.schema_version === "oro.environment_episode.v1") {
    return normalizeOroEpisode(input, sourceName);
  }
  if (/^ATIF-v1\.[0-7]$/.test(input.schema_version)) {
    return normalizeAtifTrajectory(input, sourceName);
  }
  throw new Error(`${sourceName}: unsupported schema_version ${input.schema_version}`);
}

// ---- loading.js

function validateFilename(filename) {
  if (!filename.toLowerCase().endsWith(".json")) {
    throw new Error(`${filename}: expected a .json file`);
  }
}

function parseTrajectoryText(text, sourceName) {
  let value;
  try {
    value = JSON.parse(text);
  } catch (error) {
    throw new Error(`${sourceName}: invalid JSON (${error.message})`);
  }
  return normalizeTrajectory(value, sourceName);
}

function addOrReplaceTrajectory(trajectories, trajectory) {
  const next = [...trajectories];
  const existing = next.findIndex((item) => item.id === trajectory.id);
  if (existing >= 0) next.splice(existing, 1, trajectory);
  else next.push(trajectory);
  return next;
}

// ---- render.js
function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function label(value) {
  return String(value ?? "")
    .replaceAll("_", " ")
    .replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function json(value) {
  return escapeHtml(JSON.stringify(value, null, 2));
}

function statusFor(trajectory) {
  if (trajectory.correct === true) return { key: "pass", text: "PASSED" };
  if (trajectory.correct === false) return { key: "fail", text: "FAILED" };
  return { key: "unknown", text: "UNSCORED" };
}

function summarizeObservation(value) {
  if (value == null) return "No observation";
  if (typeof value !== "object") return String(value);
  if (Array.isArray(value)) return `${value.length} items`;
  if (value.error) return `Error: ${value.error}`;
  if (value.done && value.order_id) return `Order ${value.order_id} completed`;
  if (value.sent === true) return "Message sent";
  if (Array.isArray(value.results)) return `${value.returned ?? value.results.length} results`;
  if (Array.isArray(value.items)) return `${value.items.length} items`;
  if (value.action) return label(value.action);
  if (value.status) return label(value.status);
  const keys = Object.keys(value);
  return keys.length ? keys.slice(0, 3).map(label).join(" · ") : "Empty response";
}

function renderEpisodeList(trajectories, selectedId, filters = {}) {
  const query = (filters.query ?? "").trim().toLowerCase();
  const status = filters.status ?? "all";
  const visible = trajectories.filter((trajectory) => {
    const itemStatus = statusFor(trajectory).key;
    const haystack = [trajectory.task.id, trajectory.task.family, trajectory.query, trajectory.sourceName]
      .join(" ")
      .toLowerCase();
    return (!query || haystack.includes(query)) && (status === "all" || status === itemStatus);
  });

  if (!visible.length) {
    return '<p class="empty-state">No episodes match this view.</p>';
  }

  return visible
    .map((trajectory) => {
      const state = statusFor(trajectory);
      const selected = trajectory.id === selectedId;
      return `<button class="episode-card${selected ? " is-selected" : ""}" data-episode-id="${escapeHtml(trajectory.id)}"${selected ? ' aria-current="true"' : ""}>
        <span class="episode-card__top"><span class="family-label">${escapeHtml(trajectory.task.family)}</span><span class="status-chip status-chip--${state.key}">${state.text}</span></span>
        <strong>${escapeHtml(trajectory.task.id)}</strong>
        <span class="episode-card__meta">${trajectory.timeline.length} turns · ${escapeHtml(trajectory.terminalReason)}</span>
      </button>`;
    })
    .join("");
}

function renderMessage(message) {
  return `<article class="message message--${escapeHtml(message.role)}">
    <span class="eyebrow">${escapeHtml(message.role)}</span>
    <p>${escapeHtml(message.content)}</p>
  </article>`;
}

function renderToolCall(call) {
  const observation = call.observation;
  return `<article class="tool-pair">
    <section class="tool-action">
      <span class="eyebrow">Action</span>
      <h4>${escapeHtml(call.name)}</h4>
      <details><summary>Tool arguments</summary><pre>${json(call.arguments)}</pre></details>
    </section>
    <section class="tool-observation${observation?.error ? " has-error" : ""}">
      <span class="eyebrow">Observation</span>
      <h4>${escapeHtml(summarizeObservation(observation?.value ?? observation?.error ?? null))}</h4>
      <details><summary>Full observation</summary><pre>${json(observation)}</pre></details>
    </section>
  </article>`;
}

function renderEvent(event) {
  return `<details class="event-card event-card--${escapeHtml(event.kind)}">
    <summary><span>${escapeHtml(event.kind)}</span><small>${escapeHtml(event.actor)}</small></summary>
    <pre>${json(event.payload)}</pre>
  </details>`;
}

function renderTimeline(trajectory) {
  return trajectory.timeline
    .map(
      (turn) => `<section class="turn" data-turn="${escapeHtml(turn.turn)}">
        <div class="turn-marker"><span>TURN ${escapeHtml(String(turn.turn).padStart(2, "0"))}</span></div>
        <div class="turn-body">
          ${turn.messages.map(renderMessage).join("")}
          ${turn.reasoning ? `<details class="reasoning"><summary>Reasoning</summary><p>${escapeHtml(turn.reasoning)}</p></details>` : ""}
          ${turn.toolCalls.map(renderToolCall).join("")}
          ${turn.events.map(renderEvent).join("")}
          <div class="turn-foot">${turn.latencyMs != null ? `${Number(turn.latencyMs).toFixed(1)} ms` : ""}${turn.error ? ` · ${escapeHtml(turn.error)}` : ""}</div>
        </div>
      </section>`,
    )
    .join("");
}

function renderChecks(checks) {
  const entries = Object.entries(checks ?? {});
  if (!entries.length) return '<p class="muted">No explicit verifier checks recorded.</p>';
  return `<div class="evidence-list">${entries
    .map(([key, value]) => {
      const state = value === true ? "pass" : value === false ? "fail" : "unknown";
      const text = value === true ? "PASS" : value === false ? "FAIL" : "N/A";
      return `<div class="evidence-row"><span>${escapeHtml(label(key).toLowerCase())}</span><strong class="evidence-${state}">${text}</strong></div>`;
    })
    .join("")}</div>`;
}

function renderProvenance(provenance) {
  return `<div class="evidence-list">${Object.entries(provenance ?? {})
    .filter(([, value]) => value != null)
    .map(
      ([key, value]) =>
        `<div class="evidence-row evidence-row--stack"><span>${escapeHtml(label(key).toLowerCase())}</span><code title="${escapeHtml(value)}">${escapeHtml(value)}</code></div>`,
    )
    .join("")}</div>`;
}

function renderOutcome(trajectory) {
  const state = statusFor(trajectory);
  const familyMetrics = trajectory.verdict?.family_metrics ?? {};
  const booleanFamilyMetrics = Object.fromEntries(
    Object.entries(familyMetrics).filter(
      ([key, value]) =>
        typeof value === "boolean" &&
        /(success|gate|aligned|uptake|commitment|rerank)$/.test(key),
    ),
  );
  return `<section class="outcome-hero outcome-hero--${state.key}">
      <span class="eyebrow">Evaluation outcome</span>
      <strong>${state.text}</strong>
      <p>${escapeHtml(trajectory.verdict?.explanation ?? trajectory.terminalReason)}</p>
      ${trajectory.failure?.primary ? `<p>Failure <b>${escapeHtml(trajectory.failure.primary)}</b> (${escapeHtml(trajectory.failure.categories.join(", "))})</p>` : ""}
      <div class="outcome-numbers"><span>Reward <b>${escapeHtml(trajectory.reward ?? "n/a")}</b></span><span>Terminal <b>${escapeHtml(trajectory.terminalReason)}</b></span></div>
    </section>
    <section class="evidence-section"><h3>Verifier checks</h3>${renderChecks(trajectory.verdict?.checks)}</section>
    <section class="evidence-section"><h3>Family evidence</h3>${renderChecks(booleanFamilyMetrics)}<details class="evidence-details"><summary>View all family metrics</summary><pre>${json(familyMetrics)}</pre></details></section>
    <section class="evidence-section"><h3>Provenance</h3>${renderProvenance(trajectory.provenance)}</section>`;
}

// ---- app.js

const state = { trajectories: [], selectedId: null, filters: { query: "", status: "all" } };
const elements = {
  count: document.querySelector("#episode-count"),
  dropOverlay: document.querySelector("#drop-overlay"),
  fileInput: document.querySelector("#file-input"),
  header: document.querySelector("#trajectory-header"),
  list: document.querySelector("#episode-list"),
  outcome: document.querySelector("#outcome"),
  raw: document.querySelector("#raw-json"),
  search: document.querySelector("#episode-search"),
  status: document.querySelector("#load-status"),
  timeline: document.querySelector("#timeline"),
};

function replaceTrajectory(trajectory) {
  state.trajectories = addOrReplaceTrajectory(state.trajectories, trajectory);
  if (!state.selectedId) state.selectedId = trajectory.id;
}

function selectedTrajectory() {
  return state.trajectories.find((trajectory) => trajectory.id === state.selectedId) ?? null;
}

function renderHeader(trajectory) {
  const rules = trajectory.taskRules
    ? `<details class="task-rules"><summary>Task rules given to the agent</summary><p>${escapeHtml(trajectory.taskRules)}</p></details>`
    : "";
  return `<p class="kicker">${escapeHtml(trajectory.format)} / ${escapeHtml(trajectory.task.family)}</p>
    <h2>${escapeHtml(trajectory.task.id)}</h2>
    <blockquote>${escapeHtml(trajectory.query)}</blockquote>
    ${rules}
    <div class="trajectory-meta"><span>${trajectory.timeline.length} turns</span><span>${escapeHtml(trajectory.sourceName)}</span><span>${escapeHtml(trajectory.terminalReason)}</span></div>`;
}

function render() {
  elements.count.textContent = String(state.trajectories.length);
  elements.list.innerHTML = renderEpisodeList(state.trajectories, state.selectedId, state.filters);
  for (const button of elements.list.querySelectorAll("[data-episode-id]")) {
    button.addEventListener("click", () => {
      state.selectedId = button.dataset.episodeId;
      render();
      document.querySelector(".trajectory-panel")?.scrollTo({ top: 0 });
    });
  }

  const trajectory = selectedTrajectory();
  if (!trajectory) {
    elements.header.innerHTML = "";
    elements.timeline.innerHTML = document.querySelector("#empty-template").innerHTML;
    elements.outcome.innerHTML = "";
    elements.raw.textContent = "";
    return;
  }
  elements.header.innerHTML = renderHeader(trajectory);
  elements.timeline.innerHTML = renderTimeline(trajectory);
  elements.outcome.innerHTML = renderOutcome(trajectory);
  elements.raw.textContent = JSON.stringify(trajectory.raw, null, 2);
}

async function ingestText(text, sourceName) {
  replaceTrajectory(parseTrajectoryText(text, sourceName));
}

async function ingestFiles(files) {
  const errors = [];
  for (const file of files) {
    try {
      validateFilename(file.name);
      await ingestText(await file.text(), file.name);
    } catch (error) {
      errors.push(error.message);
    }
  }
  elements.status.textContent = loadStatus(files.length - errors.length, "local file", errors);
  render();
}

function loadStatus(loaded, noun, errors, suffix = "") {
  const plural = loaded === 1 ? noun : `${noun}s`;
  return errors.length
    ? `${loaded} loaded${suffix}. ${errors.join(" ")}`
    : `${loaded} ${plural}${suffix}`;
}

function loadEmbeddedEpisodes() {
  const node = document.querySelector("#oro-episodes");
  if (!node) return false;
  const payload = JSON.parse(node.textContent);
  const errors = [];
  for (const entry of payload.episodes ?? []) {
    try {
      replaceTrajectory(normalizeTrajectory(entry.value, entry.name));
    } catch (error) {
      errors.push(error.message);
    }
  }
  const source = payload.run_id ? ` from ${payload.run_id}` : "";
  elements.status.textContent = loadStatus(state.trajectories.length, "episode", errors, source);
  render();
  return true;
}

elements.fileInput.addEventListener("change", () => ingestFiles([...elements.fileInput.files]));
elements.search.addEventListener("input", () => {
  state.filters.query = elements.search.value;
  render();
});
for (const filter of document.querySelectorAll(".filter")) {
  filter.addEventListener("click", () => {
    state.filters.status = filter.dataset.status;
    for (const button of document.querySelectorAll(".filter")) button.classList.toggle("is-active", button === filter);
    render();
  });
}

let dragDepth = 0;
document.addEventListener("dragenter", (event) => {
  event.preventDefault();
  dragDepth += 1;
  elements.dropOverlay.classList.add("is-visible");
});
document.addEventListener("dragover", (event) => event.preventDefault());
document.addEventListener("dragleave", (event) => {
  event.preventDefault();
  dragDepth -= 1;
  if (dragDepth <= 0) elements.dropOverlay.classList.remove("is-visible");
});
document.addEventListener("drop", (event) => {
  event.preventDefault();
  dragDepth = 0;
  elements.dropOverlay.classList.remove("is-visible");
  ingestFiles([...event.dataTransfer.files]);
});

if (!loadEmbeddedEpisodes()) {
  elements.status.textContent = "Open a trajectory JSON to begin";
  render();
}

})();
    </script>
  </body>
